<title>bags-traditionally | جلد طبيعي أصيل</title>

<meta property="og:type" content="website">
<meta property="og:title" content="bags-traditionally | جلد طبيعي أصيل">
<meta property="og:description" content="جلد طبيعي أصيل — مستورد من أوروبا. صاكات مخدومة من جلد حقيقي، كتعيش معاك سنين وكتزيان كل ما طال الوقت.">

<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style id="st">
/* Layout: boutique vitrine — stitched-leather frames, hero thesis, collection grid, vertical video reels, cart drawer. Single dark look by choice. */
:root{
  --hide:#17110d;        /* espresso hide */
  --hide-2:#211913;      /* raised surface */
  --hide-3:#2c211a;      /* input / card ground */
  --bone:#efe4d6;        /* text */
  --dust:#b3a291;        /* muted text */
  --cognac:#c98a4b;      /* accent */
  --cognac-ink:#1b120c;  /* text on accent */
  --stitch:rgba(201,138,75,.55);
  --line:rgba(239,228,214,.12);
  --ok:#7fb27a; --bad:#d9725f;
  --f-display:"Aref Ruqaa","IBM Plex Sans Arabic",serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-latin:"Marcellus","IBM Plex Sans Arabic",serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--hide);color:var(--bone);font-family:var(--f-body);font-size:16px;line-height:1.65}
#app{direction:rtl;max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:0 96px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cognac);outline-offset:3px}
a{color:var(--cognac)}
.stitch{position:relative}
.stitch::after{content:"";position:absolute;inset:7px;border:1.5px dashed var(--stitch);border-radius:inherit;pointer-events:none}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;background:linear-gradient(var(--hide) 70%,transparent)}
.brand{font-family:var(--f-latin);font-size:1.25rem;letter-spacing:.04em;direction:ltr}
.brand small{display:block;font-family:var(--f-body);font-size:.7rem;color:var(--dust);letter-spacing:.12em;text-transform:uppercase}
.top-actions{display:flex;gap:8px}
.icon-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--hide-2);border-radius:999px;padding:8px 14px;font-size:.9rem}
.badge{background:var(--cognac);color:var(--cognac-ink);border-radius:999px;min-width:20px;height:20px;display:inline-grid;place-items:center;font-size:.75rem;font-weight:600;font-variant-numeric:tabular-nums}

/* hero */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:center;padding-block:28px 36px}
.hero h1{font-family:var(--f-display);font-weight:700;font-size:clamp(2.6rem,9vw,4.6rem);line-height:1.15;margin:0;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--cognac)}
.hero p{color:var(--dust);font-size:1.08rem;max-width:34ch;margin:14px 0 22px}
.cta{display:inline-flex;align-items:center;gap:8px;background:var(--cognac);color:var(--cognac-ink);border:0;border-radius:12px;padding:13px 22px;font-weight:600;text-decoration:none}
.cta.ghost{background:transparent;color:var(--bone);border:1px solid var(--line)}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap}
.hero-media{aspect-ratio:4/5;max-width:100%;border-radius:22px;background:var(--hide-2);overflow:hidden}
.hero-media img{width:100%;height:100%;object-fit:cover;display:block}
.empty{display:grid;place-items:center;text-align:center;color:var(--dust);font-size:.9rem;padding:20px;height:100%;background:repeating-linear-gradient(135deg,var(--hide-2) 0 14px,var(--hide-3) 14px 15px)}
.empty b{display:block;font-family:var(--f-display);font-size:1.4rem;color:var(--bone);font-weight:400}

/* strip */
.strip{display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:center;border-block:1px dashed var(--stitch);padding-block:14px;margin-block:8px 40px;font-size:.92rem}
.strip span::before{content:"✦";color:var(--cognac);margin-inline-end:8px;font-size:.7rem}

/* sections */
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.sec-head h2{font-family:var(--f-display);font-weight:400;font-size:2rem;margin:0;line-height:1.2}
.eyebrow{font-size:.75rem;letter-spacing:.14em;color:var(--cognac);text-transform:uppercase;display:block}
section{margin-bottom:56px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--bone);color:var(--hide);border-color:var(--bone)}

/* products */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.card{background:var(--hide-2);border-radius:18px;overflow:hidden;border:0;padding:0;text-align:inherit;display:flex;flex-direction:column;transition:transform .25s ease}
.card:hover{transform:translateY(-3px)}
.card .ph{aspect-ratio:1;position:relative;overflow:hidden;background:var(--hide-3)}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
.card:hover .ph img{transform:scale(1.04)}
.card .info{padding:14px 16px 16px;display:grid;gap:4px}
.card .name{font-weight:600;font-size:1rem}
.price{font-variant-numeric:tabular-nums;color:var(--cognac);font-weight:600}
.price s{color:var(--dust);font-weight:400;margin-inline-start:6px;font-size:.88em}
.tag{position:absolute;top:12px;inset-inline-start:12px;background:var(--bone);color:var(--hide);font-size:.72rem;font-weight:600;padding:3px 10px;border-radius:999px}
.tag.sale{background:var(--cognac);color:var(--cognac-ink)}

/* videos */
.reels{display:grid;grid-auto-flow:column;grid-auto-columns:min(220px,62vw);gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px}
.reel{scroll-snap-align:start;aspect-ratio:9/16;border-radius:18px;overflow:hidden;background:var(--hide-2);position:relative}
.reel video{width:100%;height:100%;object-fit:cover;display:block;background:#000}
.reel figcaption{position:absolute;inset-inline:0;bottom:0;padding:24px 12px 12px;font-size:.85rem;background:linear-gradient(transparent,rgba(0,0,0,.7));pointer-events:none}

/* why leather */
.why{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.why div{background:var(--hide-2);border-radius:18px;padding:22px}
.why h3{font-family:var(--f-display);font-weight:400;font-size:1.4rem;margin:0 0 6px;color:var(--cognac)}
.why p{margin:0;color:var(--dust)}

footer{border-top:1px dashed var(--stitch);padding-top:24px;color:var(--dust);font-size:.9rem;display:grid;gap:6px}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;color:var(--bone)}

/* floating whatsapp */
.wa-float{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));inset-inline-start:18px;z-index:30;background:#25d366;color:#08250f;border-radius:999px;padding:12px 18px;font-weight:600;text-decoration:none;box-shadow:0 8px 24px rgba(0,0,0,.4);direction:rtl}

/* overlays */
.scrim{position:fixed;inset:0;background:rgba(8,5,3,.7);z-index:40;display:flex;justify-content:center;align-items:flex-end}
.sheet{direction:rtl;background:var(--hide-2);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px))}
@media (min-width:720px){.scrim{align-items:center}.sheet{border-radius:22px}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.sheet-head h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:1.6rem}
.x{border:0;background:var(--hide-3);border-radius:999px;width:36px;height:36px;font-size:1.1rem}
.gallery{display:grid;grid-auto-flow:column;grid-auto-columns:100%;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:16px;aspect-ratio:1;max-width:100%;background:var(--hide-3)}
.gallery>*{scroll-snap-align:start}
.gallery img{width:100%;height:100%;object-fit:cover;display:block}
.dots{display:flex;gap:5px;justify-content:center;margin-top:8px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.qty button{border:0;background:transparent;width:38px;height:40px;font-size:1.1rem}
.qty span{min-width:30px;text-align:center;font-variant-numeric:tabular-nums}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.line-item{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding-block:10px;border-bottom:1px solid var(--line)}
.line-item .thumb{width:56px;height:56px;border-radius:10px;overflow:hidden;background:var(--hide-3)}
.line-item .thumb img{width:100%;height:100%;object-fit:cover}
.total{display:flex;justify-content:space-between;font-size:1.1rem;font-weight:600;padding-block:14px}
label.f{display:grid;gap:4px;font-size:.88rem;color:var(--dust);margin-bottom:10px}
.f input,.f textarea,.f select{background:var(--hide-3);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--bone);width:100%}
.f textarea{min-height:76px;resize:vertical}
.note{font-size:.82rem;color:var(--dust)}
.toast{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--bone);color:var(--hide);padding:10px 18px;border-radius:999px;z-index:60;font-weight:600;direction:rtl;max-width:90vw}

/* admin */
.admin-bar{position:fixed;inset-inline:0;bottom:0;z-index:35;background:var(--cognac);color:var(--cognac-ink);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;justify-content:space-between;direction:rtl;font-weight:600}
.admin-bar button{border:0;border-radius:10px;padding:8px 14px;background:var(--cognac-ink);color:var(--bone);font-weight:600}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.adm-item{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;background:var(--hide-3);border-radius:12px;padding:8px;margin-bottom:8px}
.adm-item .thumb{width:52px;height:52px;border-radius:8px;overflow:hidden;background:var(--hide)}
.adm-item .thumb img,.adm-item .thumb video{width:100%;height:100%;object-fit:cover}
.mini{border:1px solid var(--line);background:transparent;border-radius:8px;padding:5px 10px;font-size:.82rem}
.mini.danger{color:var(--bad);border-color:rgba(217,114,95,.4)}
.imgs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.imgs .im{width:72px;height:72px;border-radius:10px;overflow:hidden;position:relative;background:var(--hide-3)}
.imgs .im img{width:100%;height:100%;object-fit:cover}
.imgs .im button{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;font-size:.75rem;padding:0}
.add-tile{width:72px;height:72px;border-radius:10px;border:1.5px dashed var(--stitch);display:grid;place-items:center;color:var(--cognac);font-size:1.6rem;cursor:pointer}
.meter{height:6px;background:var(--hide-3);border-radius:99px;overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--cognac)}
.check{display:flex;gap:8px;align-items:center;margin-bottom:10px;font-size:.9rem}

@media (max-width:720px){
  .hero{grid-template-columns:1fr;padding-top:10px}
  .hero-media{aspect-ratio:4/3.4;order:-1}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .card .info{padding:10px 12px 12px}
  .card .name{font-size:.92rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

(function(){

}
function visibleProducts(){return S.products.filter(function(p){return filter==='الكل'||p.cat===filter})}

/* ---------- storefront ---------- */

function compress(file,max,q){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){var img=new Image();img.onload=function(){var sc=Math.min(1,max/Math.max(img.width,img.height));var c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};img.onerror=rej;img.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
function readVideo(file){return new Promise(function(res,rej){if(file.size>5*1048576){rej('big');return}var r=new FileReader();r.onload=function(){res(r.result)};r.onerror=rej;r.readAsDataURL(file)})}

/* ---------- draft kept in this browser (IndexedDB) ---------- */
var dbP=null;
function idb(){if(dbP)return dbP;dbP=new Promise(function(res,rej){try{var r=indexedDB.open('bt-admin',1);r.onupgradeneeded=function(){r.result.createObjectStore('kv')};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}}catch(e){rej(e)}});return dbP}
function idbSet(k,v){return idb().then(function(d){return new Promise(function(res,rej){var t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=rej})})}
function idbGet(k){return idb().then(function(d){return new Promise(function(res,rej){var q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=function(){res(q.result)};q.onerror=rej})})}
var saveT=null;
function markDirty(){dirty=true;clearTimeout(saveT);saveT=setTimeout(function(){idbSet('draft',JSON.stringify(S)).catch(function(){})},400)}

    +'<title>'+esc(s.name)+' | '+esc(s.heroTitle)+'</title>\n<meta name="description" content="'+desc+'">\n'

    +(og?'<meta property="og:image" content="'+og+'">\n':'')

    +'<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Marcellus&display=swap">\n'

function publish(){
  if(!dirty)return;
  var html=buildDoc(S,'');
  var blob=new Blob([html],{type:'text/html'});
  var mb=(blob.size/1048576).toFixed(1);
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='index.html';document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},4000);

/* ---------- events ---------- */
function onClick(e){
  var b=e.target.closest('[data-act]');if(!b)return;var a=b.dataset.act;
  if(a==='filter'){filter=b.dataset.v;render();return}
  if(a==='open'){openProduct(b.dataset.id);return}
  if(a==='close'){closeOverlay();return}
  if(a==='scroll'){document.getElementById('collection').scrollIntoView({behavior:'smooth'});return}
  if(a==='cart'){if(cart.length&&!canEdit)track('InitiateCheckout');openCart();return}
  if(a==='wa'){if(!canEdit)track('Contact');return}
  if(a==='dq'){detailQty=Math.max(1,detailQty+Number(b.dataset.v));document.getElementById('dq').textContent=detailQty;return}
  if(a==='add'){var ex=cart.filter(function(i){return i.id===b.dataset.id})[0];if(ex)ex.q+=detailQty;else cart.push({id:b.dataset.id,q:detailQty});saveCart();if(!canEdit)track('AddToCart',prod(b.dataset.id),detailQty);closeOverlay();render();toast('تزاد للسلة');return}
  if(a==='cq'){var it=cart.filter(function(i){return i.id===b.dataset.id})[0];if(it){it.q+=Number(b.dataset.v);if(it.q<1)cart=cart.filter(function(i){return i!==it})}saveCart();render();openCart();return}
  if(!canEdit)return;
  if(a==='admin'){render();openAdmin();return}
  if(a==='tab'){adminTab=b.dataset.v;openAdmin();return}
  if(a==='publish'){publish();return}
  if(a==='newp'){var p={id:uid(),name:'',price:0,oldPrice:0,desc:'',cat:'',images:[],soldOut:false};S.products.unshift(p);markDirty();render();openEditor(p.id);return}
  if(a==='editp'){openEditor(b.dataset.id);return}
  if(a==='up'){var i=Number(b.dataset.i);if(i>0){var t=S.products[i];S.products[i]=S.products[i-1];S.products[i-1]=t;markDirty();render();openAdmin()}return}
  if(a==='delp'){if(b.dataset.sure){S.products=S.products.filter(function(p){return p.id!==b.dataset.id});cart=cart.filter(function(c){return c.id!==b.dataset.id});saveCart();markDirty();render();openAdmin()}else{b.dataset.sure='1';b.textContent='متأكد؟ ضغط مرة أخرى'}return}
  if(a==='delimg'){var pp=prod(editId);pp.images.splice(Number(b.dataset.i),1);markDirty();render();openEditor(editId);return}
  if(a==='delv'){if(b.dataset.sure){S.videos.splice(Number(b.dataset.i),1);markDirty();render();openAdmin()}else{b.dataset.sure='1';b.textContent='متأكد؟'}return}
  if(a==='delhero'){S.settings.heroImage='';markDirty();render();openAdmin();return}
}
function onInput(e){
  if(!canEdit)return;var t=e.target;
  if(t.dataset.p&&t.type!=='checkbox'){var p=prod(editId);var k=t.dataset.p;p[k]=(k==='price'||k==='oldPrice')?Number(t.value.replace(/[^\d.]/g,''))||0:t.value;markDirty();render();return}
  if(t.dataset.s){S.settings[t.dataset.s]=t.dataset.s==='features'?t.value.split('\n').map(function(x){return x.trim()}).filter(Boolean):t.value;markDirty();render();return}
  if(t.dataset.vc){S.videos.forEach(function(v){if(v.id===t.dataset.vc)v.caption=t.value});markDirty();render();return}
}
function onChange(e){
  if(!canEdit)return;var t=e.target;
  if(t.dataset.p==='soldOut'){prod(editId).soldOut=t.checked;markDirty();render();return}
  if(t.id==='img-in'&&t.files.length){var p=prod(editId);var fs=[].slice.call(t.files,0,5-p.images.length);toast('كيتحمّل...');Promise.all(fs.map(function(f){return compress(f,1100,.8)})).then(function(arr){p.images=p.images.concat(arr);markDirty();render();openEditor(editId)}).catch(function(){toast('ما قدرتش نقرا التصويرة. جرب وحدة أخرى.')});return}
  if(t.id==='hero-in'&&t.files[0]){compress(t.files[0],1400,.82).then(function(d){S.settings.heroImage=d;markDirty();render();openAdmin()}).catch(function(){toast('ما قدرتش نقرا التصويرة.')});return}
  if((t.id==='vid-in'||t.dataset.vslot)&&t.files[0]){toast('كيتحمّل...');readVideo(t.files[0]).then(function(d){if(t.dataset.vslot){S.videos.forEach(function(v){if(v.id===t.dataset.vslot)v.src=d})}else S.videos.unshift({id:uid(),src:d,caption:''});markDirty();render();openAdmin()}).catch(function(err){toast(err==='big'?'الفيديو كبير. خاصو يكون أقل من 5 ميغا.':'ما قدرتش نقرا الفيديو.')});return}
}
app.addEventListener('click',onClick);

/* ---------- boot ---------- */
function setMode(){
  var want=location.hash==='#admin';
  if(want===canEdit)return;
  canEdit=want;
  if(canEdit){idbGet('draft').then(function(d){if(d){S=JSON.parse(d);dirty=true}render()}).catch(function(){render()})}
  else render();
}
window.addEventListener('hashchange',setMode);
render();setMode();
})();
</script>
</body>
</html>
